name: Freshness

# The owner's rule (2026-09-30): mzizi.dev must never lag the language or the
# components. This builds the site from the live API and then compares what it
# says with the live upstream facts: the language README's test count, npm,
# crates.io and the MCP Registry (scripts/check-facts.py).
#
# It needs the network and fails whenever an upstream moves, so it is
# deliberately NOT a required check: a manual run and a daily run, never on
# pull_request. A red run here is the signal to open a site-update PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: freshness
  cancel-in-progress: true

jobs:
  facts:
    name: facts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: The built site agrees with upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-facts.py dist
